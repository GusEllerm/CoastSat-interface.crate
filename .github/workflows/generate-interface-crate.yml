name: Generate Interface Crate

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-interface-crate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensures full commit history is cloned

      - name: Clone latest CoastSat repository
        run: |
          echo "::notice::Cloning latest CoastSat repository from upstream..."
          git clone https://github.com/UoA-eResearch/CoastSat.git CoastSat
          
          # Get the commit information
          COASTSAT_COMMIT=$(git -C CoastSat rev-parse HEAD)
          COASTSAT_COMMIT_SHORT=$(git -C CoastSat rev-parse --short HEAD)
          COASTSAT_COMMIT_MSG=$(git -C CoastSat log -1 --pretty=%B | head -n 1)
          COASTSAT_COMMIT_DATE=$(git -C CoastSat log -1 --pretty=%ci)
          COASTSAT_COMMIT_AUTHOR=$(git -C CoastSat log -1 --pretty=%an)
          
          echo "::notice::=========================================="
          echo "::notice::Building Interface Crate from latest CoastSat commit"
          echo "::notice::=========================================="
          echo "::notice::Commit ID: ${COASTSAT_COMMIT}"
          echo "::notice::Short ID: ${COASTSAT_COMMIT_SHORT}"
          echo "::notice::Message: ${COASTSAT_COMMIT_MSG}"
          echo "::notice::Date: ${COASTSAT_COMMIT_DATE}"
          echo "::notice::Author: ${COASTSAT_COMMIT_AUTHOR}"
          echo "::notice::=========================================="
          
          # Save commit info for later steps
          echo "COASTSAT_COMMIT=${COASTSAT_COMMIT}" >> $GITHUB_ENV
          echo "COASTSAT_COMMIT_SHORT=${COASTSAT_COMMIT_SHORT}" >> $GITHUB_ENV

      - name: Check token permissions
        run: |
          echo "Checking if the token has the required permissions..."
          
          # Check if we can authenticate
          if ! gh auth status > /dev/null 2>&1; then
            echo "::error::Unable to authenticate with GitHub token"
            exit 1
          fi
          
          # Get repository permissions
          RESPONSE=$(gh api repos/${{ github.repository }} --jq '.permissions' 2>&1) || {
            echo "::error::Failed to fetch repository permissions. Ensure the token has 'repo' scope."
            exit 1
          }
          
          # Check for required permissions (admin or push to create releases)
          HAS_PUSH=$(echo "$RESPONSE" | jq -r '.push // false')
          HAS_ADMIN=$(echo "$RESPONSE" | jq -r '.admin // false')
          
          if [[ "$HAS_PUSH" != "true" && "$HAS_ADMIN" != "true" ]]; then
            echo "::error::Token does not have sufficient permissions to create releases."
            echo "::error::Required: 'push' or 'admin' permission on the repository."
            echo "::error::Please ensure the token has the 'repo' scope and appropriate permissions."
            exit 1
          fi
          
          echo "✓ Token has sufficient permissions to create releases"
        env:
          GH_TOKEN: ${{ secrets.GH_GIST_TOKEN }}

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v2
        with:
          activate-environment: coastsat_stencila_env
          environment-file: environment.yaml
          python-version: "3.10"

      - name: Export GitHub Gist token
        run: echo "GITHUB_TOKEN=${{ secrets.GH_GIST_TOKEN }}" >> $GITHUB_ENV

      - name: Generate Interface Crate
        run: |
          conda run -n coastsat_stencila_env python LP_Crate/interface_crate.py  --limit none

      - name: Patch release URL into interface.crate
        run: |
          # Temporarily 
          echo "RELEASE_NAME=placeholder" >> $GITHUB_ENV
          echo "RELEASE_URL=placeholder" >> $GITHUB_ENV

      - name: Zip interface crate
        run: (cd LP_Crate && zip -r ../interface-crate.zip interface.crate/)

      - name: Install GitHub CLI
        run: sudo apt-get install gh


      - name: Set release name
        id: set_release_name
        run: |
          DATE=$(date +"%Y%m%d%H%M%S")
          echo "RELEASE_NAME=interface.crate-${COASTSAT_COMMIT_SHORT}-${DATE}" >> $GITHUB_ENV
          echo "::notice::Release will be named: interface.crate-${COASTSAT_COMMIT_SHORT}-${DATE}"

      - name: Create release with CoastSat commit ID
        run: |
          gh release create "${RELEASE_NAME}" \
            --title "Interface Crate (CoastSat ${COASTSAT_COMMIT_SHORT})" \
            --notes "Autogenerated Interface Crate from CoastSat commit ${COASTSAT_COMMIT}

          Built on: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          CoastSat Repository: https://github.com/UoA-eResearch/CoastSat
          CoastSat Commit: ${COASTSAT_COMMIT}"
        env:
          GH_TOKEN: ${{ secrets.GH_GIST_TOKEN }}

      - name: Patch release URL into interface.crate
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_NAME}"
           conda run -n coastsat_stencila_env python LP_Crate/patch_release_url.py "$RELEASE_URL"

      - name: Re-zip patched interface crate
        run: (cd LP_Crate && zip -r ../interface-crate.zip interface.crate/)

      - name: Upload crate to release
        run: |
          gh release upload "${RELEASE_NAME}" interface-crate.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GH_GIST_TOKEN }}